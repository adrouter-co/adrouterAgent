name: release-tag

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate immutable release tag
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - name: Verify exact release identity
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v0.1.0-beta.1"
          test "$(node -p "require('./package.json').version")" = "0.1.0-beta.1"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          grep -F "## [0.1.0-beta.1]" CHANGELOG.md
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check
      - run: npm run check:launcher-package
      - run: npm run test:e2e

  canary:
    name: protected live AdRouter canary
    needs: validate
    runs-on: macos-14
    timeout-minutes: 15
    environment: adrouter-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - name: Verify live model discovery and terminal agent stream
        env:
          ADROUTER_API_URL: ${{ secrets.ADROUTER_STAGING_URL }}
          ADROUTER_API_KEY: ${{ secrets.ADROUTER_STAGING_API_KEY }}
        run: npm run smoke:live

  build:
    name: credential-free ad-hoc universal release
    needs: [validate, canary]
    runs-on: macos-14
    timeout-minutes: 75
    environment: macos-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - name: Verify protected release identity
        run: |
          test "$GITHUB_REF_NAME" = "v0.1.0-beta.1"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run make:mac
      - run: npm run verify:dist
      - run: node scripts/prepare-release-assets.mjs 0.1.0-beta.1
      - run: node scripts/verify-release-assets.mjs out/release
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: out/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AdRouter-Agent-0.1.0-beta.1-release
          path: out/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Create immutable draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" out/release/* \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --draft \
            --prerelease \
            --title "AdRouter Agent $GITHUB_REF_NAME public beta" \
            --notes-file CHANGELOG.md
