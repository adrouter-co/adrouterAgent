name: release-tag

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate immutable release tag
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - name: Verify exact release identity
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${version#*-beta.}" != "$version"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          grep -F "## [$version]" CHANGELOG.md
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:build
      - run: npm run check
      - run: npm run check:launcher-package
      - run: npm run test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  package:
    name: build ${{ matrix.key }} portable artifact
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - key: darwin-universal
            runner: macos-14
            make: make:mac
            verify: verify:dist
          - key: linux-x64
            runner: ubuntu-24.04
            make: make:linux
            verify: verify:dist:linux
          - key: win32-x64
            runner: windows-2025
            make: make:windows
            verify: verify:dist:windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.make }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run ${{ matrix.verify }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.key }}
          path: out/make/**/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: aggregate credential-free beta release
    needs: package
    runs-on: macos-14
    timeout-minutes: 30
    environment: macos-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: out/make
          merge-multiple: true
      - run: npm ci
      - name: Prepare and verify exact release inventory
        env:
          ADROUTER_CREDENTIAL_FREE_BETA: '1'
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/prepare-release-assets.mjs "$version"
          node scripts/verify-release-assets.mjs out/release
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: out/release/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AdRouter-Agent-portable-release
          path: out/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace assets." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" out/release/* \
            --verify-tag --target "$GITHUB_SHA" --draft --prerelease \
            --title "AdRouter Agent $GITHUB_REF_NAME candidate beta" --notes-file CHANGELOG.md
