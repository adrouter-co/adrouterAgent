name: promote-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        default: v0.1.0-beta.16
        type: string
      phase:
        description: Explicit pausable promotion phase
        required: true
        type: choice
        options:
          - publish-candidate
          - finalize-release
      channel:
        description: Distribution policy for this immutable version
        required: true
        default: beta
        type: choice
        options:
          - beta
      operator_acceptance_override:
        description: One-time beta.16 operator override for the acceptance JSON gate
        required: true
        default: false
        type: boolean
      operator_acceptance_override_reason:
        description: Required audit reason when the beta.16 acceptance override is enabled
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-candidate:
    name: publish GitHub then npm candidate
    if: inputs.phase == 'publish-candidate'
    runs-on: macos-14
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      was_draft: ${{ steps.identity.outputs.was_draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org
      - id: identity
        name: Verify exact draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${{ inputs.tag }}" = "v$version"
          test "${{ inputs.channel }}" = "beta"
          test "${version#*-}" != "$version"
          expected_prerelease=true
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(git rev-list -n 1 "${{ inputs.tag }}")" = "$(git rev-parse HEAD)"
          test "$(gh release view "${{ inputs.tag }}" --json isPrerelease --jq .isPrerelease)" = "$expected_prerelease"
          was_draft="$(gh release view "${{ inputs.tag }}" --json isDraft --jq .isDraft)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "was_draft=$was_draft" >> "$GITHUB_OUTPUT"
      - name: Download and verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          gh release download "${{ inputs.tag }}" --dir "$RUNNER_TEMP/release"
          node scripts/verify-release-assets.mjs "$RUNNER_TEMP/release"
      - name: Publish GitHub release before npm
        if: steps.identity.outputs.was_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ inputs.tag }}" --draft=false --prerelease
      - name: Verify public ZIP is anonymously downloadable
        run: |
          version="${{ steps.identity.outputs.version }}"
          for target in darwin-universal linux-x64 win32-x64; do
            name="AdRouter-Agent-$version-$target.zip"
            curl --fail --silent --show-error --location --retry 6 --retry-all-errors \
              --output "$RUNNER_TEMP/$name" \
              "https://github.com/adrouter/adrouterAgent/releases/download/${{ inputs.tag }}/$name"
            expected="$(awk -v name="$name" '$2 == name { print $1 }' "$RUNNER_TEMP/release/SHA256SUMS")"
            test "$(shasum -a 256 "$RUNNER_TEMP/$name" | awk '{ print $1 }')" = "$expected"
          done
      - name: Publish exact npm candidate through trusted publishing
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          tarball="$RUNNER_TEMP/release/adrouter-agent-$VERSION.tgz"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if published="$(npm view "@adrouter/agent@$VERSION" version 2>/dev/null)"; then
            test "$published" = "$VERSION"
            test "$(npm view "@adrouter/agent@$VERSION" dist.integrity)" = "$local_integrity"
            test "$(npm view @adrouter/agent dist-tags.candidate)" = "$VERSION"
          else
            npm view @adrouter/agent name >/dev/null
            npm publish "$tarball" \
              --access public \
              --tag candidate \
              --provenance \
              --ignore-scripts
          fi

  candidate-public-smoke:
    name: anonymous public smoke (${{ matrix.architecture }})
    needs: publish-candidate
    if: inputs.phase == 'publish-candidate'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            asset: darwin-universal
          - architecture: x64
            runner: macos-15-intel
            asset: darwin-universal
          - architecture: x64
            runner: ubuntu-24.04
            asset: linux-x64
          - architecture: x64
            runner: windows-2025
            asset: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - name: Install exact candidate from a clean anonymous npm config
        run: |
          : > "$RUNNER_TEMP/empty.npmrc"
          for attempt in {1..36}; do
            if npm view @adrouter/agent@candidate version \
              --userconfig "$RUNNER_TEMP/empty.npmrc" >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 36
            sleep 10
          done
          npm install --global @adrouter/agent@candidate \
            --prefix "$RUNNER_TEMP/npm-prefix" \
            --userconfig "$RUNNER_TEMP/empty.npmrc" \
            --ignore-scripts
          if test "$RUNNER_OS" = "Windows"; then
            export PATH="$RUNNER_TEMP/npm-prefix:$PATH"
            cli=adrouter-agent.cmd
          else
            export PATH="$RUNNER_TEMP/npm-prefix/bin:$PATH"
            cli=adrouter-agent
          fi
          test "$("$cli" --version | tr -d '\r')" = "${{ needs.publish-candidate.outputs.version }}"
          "$cli" install
          "$cli" doctor --json | tee "$RUNNER_TEMP/doctor.json"
          node -e "const r=require(process.env.RUNNER_TEMP + '/doctor.json'); const signature=r.platform==='darwin'?'adhoc':'unsigned-portable'; if (r.schema!==3 || !r.installed || !r.receiptMatches || !r.bundleIntegrity || r.signatureType!==signature) process.exit(1)"
          "$cli" launch

  verify-finalization:
    name: verify public candidate and acceptance
    if: inputs.phase == 'finalize-release'
    runs-on: macos-14
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
      - id: identity
        name: Verify exact public candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_ACCEPTANCE_OVERRIDE: ${{ inputs.operator_acceptance_override }}
          OPERATOR_ACCEPTANCE_OVERRIDE_REASON: ${{ inputs.operator_acceptance_override_reason }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${{ inputs.tag }}" = "v$version"
          test "${{ inputs.channel }}" = "beta"
          test "${version#*-}" != "$version"
          expected_prerelease=true
          if test "$OPERATOR_ACCEPTANCE_OVERRIDE" = "true"; then
            test "$version" = "0.1.0-beta.16"
            test "$GITHUB_REF" = "refs/heads/main"
            test -n "$OPERATOR_ACCEPTANCE_OVERRIDE_REASON"
            test "${#OPERATOR_ACCEPTANCE_OVERRIDE_REASON}" -le 512
          else
            test "$GITHUB_REF" = "refs/tags/v$version"
          fi
          test "$(git rev-list -n 1 "${{ inputs.tag }}")" = "$(git rev-parse HEAD)"
          test "$(gh release view "${{ inputs.tag }}" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "${{ inputs.tag }}" --json isPrerelease --jq .isPrerelease)" = "$expected_prerelease"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require exact immutable assets and sanitized authentication acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          OPERATOR_ACCEPTANCE_OVERRIDE: ${{ inputs.operator_acceptance_override }}
          OPERATOR_ACCEPTANCE_OVERRIDE_REASON: ${{ inputs.operator_acceptance_override_reason }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          gh release download "${{ inputs.tag }}" --dir "$RUNNER_TEMP/release"
          if test "$OPERATOR_ACCEPTANCE_OVERRIDE" = "true"; then
            node scripts/verify-release-assets.mjs "$RUNNER_TEMP/release"
            echo "::warning title=Operator acceptance override::beta.16 finalization is using the explicitly authorized live macOS/Windows operator attestation instead of authentication-acceptance.json."
            {
              echo "### Operator acceptance override"
              echo
              echo "- Immutable tag: ${{ inputs.tag }}"
              printf '%s\n' "- Reason: $OPERATOR_ACCEPTANCE_OVERRIDE_REASON"
              echo "- Scope: acceptance JSON only; artifact, integrity, registry, and public smoke checks remain required."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/verify-release-assets.mjs "$RUNNER_TEMP/release" --require-acceptance
          fi
          tarball="$RUNNER_TEMP/release/adrouter-agent-$VERSION.tgz"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          test "$(npm view "@adrouter/agent@$VERSION" version)" = "$VERSION"
          test "$(npm view "@adrouter/agent@$VERSION" dist.integrity)" = "$local_integrity"
          tags_json="$(npm view @adrouter/agent dist-tags --json)"
          TAGS_JSON="$tags_json" VERSION="$VERSION" node -e '
            const tags = JSON.parse(process.env.TAGS_JSON);
            const alreadyFinal = process.env.CHANNEL === "beta"
              ? tags.beta === process.env.VERSION && tags.latest === process.env.VERSION && !Object.hasOwn(tags, "candidate")
              : tags.latest === process.env.VERSION && tags.beta !== process.env.VERSION && !Object.hasOwn(tags, "candidate");
            process.exit(tags.candidate === process.env.VERSION || alreadyFinal ? 0 : 1);
          '
  final-public-smoke:
    name: final anonymous public smoke (${{ matrix.architecture }})
    needs: verify-finalization
    if: inputs.phase == 'finalize-release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
      - name: Reinstall exact public candidate anonymously
        run: |
          : > "$RUNNER_TEMP/empty.npmrc"
          npm install --global "@adrouter/agent@${{ needs.verify-finalization.outputs.version }}" \
            --prefix "$RUNNER_TEMP/npm-prefix" \
            --userconfig "$RUNNER_TEMP/empty.npmrc" \
            --ignore-scripts
          if test "$RUNNER_OS" = "Windows"; then
            export PATH="$RUNNER_TEMP/npm-prefix:$PATH"
            cli=adrouter-agent.cmd
          else
            export PATH="$RUNNER_TEMP/npm-prefix/bin:$PATH"
            cli=adrouter-agent
          fi
          test "$("$cli" --version | tr -d '\r')" = "${{ needs.verify-finalization.outputs.version }}"
          "$cli" install
          "$cli" doctor --json | tee "$RUNNER_TEMP/doctor.json"
          node -e "const r=require(process.env.RUNNER_TEMP + '/doctor.json'); const signature=r.platform==='darwin'?'adhoc':'unsigned-portable'; if (r.schema!==3 || !r.installed || !r.receiptMatches || !r.bundleIntegrity || r.signatureType!==signature) process.exit(1)"
          "$cli" launch

  finalize-release:
    name: validate acceptance and promote channels
    needs: [verify-finalization, final-public-smoke]
    if: inputs.phase == 'finalize-release'
    runs-on: macos-14
    timeout-minutes: 10
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org
      - name: Move public distribution tags and verify registry integrity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          VERSION: ${{ needs.verify-finalization.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          OPERATOR_ACCEPTANCE_OVERRIDE: ${{ inputs.operator_acceptance_override }}
        run: |
          test "$(npm view "@adrouter/agent@$VERSION" version)" = "$VERSION"
          tags_json="$(npm view @adrouter/agent dist-tags --json)"
          if TAGS_JSON="$tags_json" VERSION="$VERSION" OPERATOR_ACCEPTANCE_OVERRIDE="$OPERATOR_ACCEPTANCE_OVERRIDE" node -e '
            const tags = JSON.parse(process.env.TAGS_JSON);
            const expected = process.env.CHANNEL === "beta"
              ? tags.beta === process.env.VERSION && tags.latest === process.env.VERSION
              : tags.latest === process.env.VERSION && tags.beta !== process.env.VERSION;
            const candidateOk = !Object.hasOwn(tags, "candidate") ||
              (process.env.OPERATOR_ACCEPTANCE_OVERRIDE === "true" &&
                tags.candidate === process.env.VERSION);
            process.exit(expected && candidateOk ? 0 : 1);
          '; then
            exit 0
          fi
          test -n "$NODE_AUTH_TOKEN"
          if test "$OPERATOR_ACCEPTANCE_OVERRIDE" = "true"; then
            test "$VERSION" = "0.1.0-beta.16"
          fi
          test "$(npm view @adrouter/agent dist-tags.candidate)" = "$VERSION"
          if test "$CHANNEL" = "beta"; then
            test "${VERSION#*-}" != "$VERSION"
            npm dist-tag add "@adrouter/agent@$VERSION" beta
            npm dist-tag add "@adrouter/agent@$VERSION" latest
          else
            test "${VERSION#*-}" = "$VERSION"
            npm dist-tag add "@adrouter/agent@$VERSION" latest
          fi
          candidate="$(npm view @adrouter/agent dist-tags.candidate)"
          if test "$candidate" = "$VERSION"; then
            if npm dist-tag rm @adrouter/agent candidate; then
              :
            elif test "$OPERATOR_ACCEPTANCE_OVERRIDE" = "true"; then
              echo "::warning title=Candidate alias retained::npm accepted beta/latest but denied candidate deletion; candidate remains on the same immutable beta.16 artifact."
              {
                echo "### Candidate cleanup override"
                echo
                echo "- npm candidate deletion returned a registry authorization error."
                echo "- beta, latest, and candidate must all resolve to $VERSION."
                echo "- No package version, Git tag, or release asset was replaced."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              exit 1
            fi
          else
            test -z "$candidate"
          fi
          for attempt in {1..18}; do
            tags_json="$(npm view @adrouter/agent dist-tags --json)"
            if TAGS_JSON="$tags_json" VERSION="$VERSION" OPERATOR_ACCEPTANCE_OVERRIDE="$OPERATOR_ACCEPTANCE_OVERRIDE" node -e '
              const tags = JSON.parse(process.env.TAGS_JSON);
              const expected = process.env.CHANNEL === "beta"
                ? tags.beta === process.env.VERSION && tags.latest === process.env.VERSION
                : tags.latest === process.env.VERSION && tags.beta !== process.env.VERSION;
              const candidateOk = !Object.hasOwn(tags, "candidate") ||
                (process.env.OPERATOR_ACCEPTANCE_OVERRIDE === "true" &&
                  tags.candidate === process.env.VERSION);
              process.exit(expected && candidateOk ? 0 : 1);
            '; then
              break
            fi
            test "$attempt" -lt 18
            sleep 5
          done
          npm view "@adrouter/agent@$VERSION" dist.integrity repository --json
      - name: Remind operator to revoke temporary dist-tag access
        run: |
          echo "::notice::Delete NPM_DIST_TAG_TOKEN from npm-publish and revoke the short-lived granular npm token after verification."
