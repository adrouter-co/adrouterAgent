name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:build
      - run: npm run check
      - run: npm run check:launcher-package
      - run: npm run test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: git diff --check

  cross-platform:
    name: ${{ matrix.name }} portability
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            make: make:linux
            verify: verify:dist:linux
          - name: Windows 11 x64
            runner: windows-2025
            make: make:windows
            verify: verify:dist:windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:launcher
      - run: npm run ${{ matrix.make }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run ${{ matrix.verify }}
      - run: git diff --check
