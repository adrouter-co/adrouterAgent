name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:build
      - run: npm run check
      - run: npm run check:launcher-package
      - run: npm run test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build normal credential-free universal application
        run: npm run make:mac
        env:
          ADROUTER_E2E_BUILD: '0'
          ADROUTER_CREDENTIAL_FREE_BETA: '1'
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run verify:dist
      - name: Record tested artifact checksums
        run: node scripts/staging-manifest.mjs out/make/zip/darwin/universal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-${{ github.sha }}-darwin-universal
          path: out/make/zip/darwin/universal/
          if-no-files-found: error
          retention-days: 7
      - run: git diff --check

  cross-platform:
    name: ${{ matrix.name }} portability
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            make: make:linux
            verify: verify:dist:linux
          - name: Windows 11 x64
            runner: windows-2025
            make: make:windows
            verify: verify:dist:windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:launcher
      - run: npm run ${{ matrix.make }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run ${{ matrix.verify }}
      - run: git diff --check

      - name: Record tested artifact checksums
        run: node scripts/staging-manifest.mjs out/make/zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-${{ github.sha }}-${{ runner.os }}-x64
          path: out/make/zip/
          if-no-files-found: error
          retention-days: 7
